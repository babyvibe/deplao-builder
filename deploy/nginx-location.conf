# Include inside your existing HTTPS server block.
# Set DEPLAO_WEB_ORIGIN to this server's exact public HTTPS origin.
location / {
    proxy_pass http://127.0.0.1:27800;
    proxy_set_header Host 127.0.0.1:27800;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 64m;
}
